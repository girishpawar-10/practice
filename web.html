<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Clone</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; }
    header { background: #131921; color: white; padding: 10px; display: flex; align-items: center; }
    header img { height: 40px; margin-right: 20px; }
    .search-bar { flex: 1; }
    .search-bar input { width: 80%; padding: 8px; }
    nav { background: #232f3e; color: white; padding: 10px; }
    nav a { color: white; margin-right: 15px; text-decoration: none; }
    .products { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 20px; }
    .product { border: 1px solid #ddd; padding: 10px; text-align: center; }
    .product img { max-width: 100%; height: 150px; object-fit: contain; }
    footer { background: #131921; color: white; text-align: center; padding: 20px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon Logo">
    <div class="search-bar">
      <input type="text" placeholder="Search Amazon">
      <button>Search</button>
    </div>
    <div class="account">Hello, Sign in</div>
  </header>

  <!-- Navigation -->
  <nav>
    <a href="#">Today's Deals</a>
    <a href="#">Customer Service</a>
    <a href="#">Registry</a>
    <a href="#">Gift Cards</a>
    <a href="#">Sell</a>
  </nav>

  <!-- Product Grid -->
  <section class="products">
    <div class="product">
      <img src="https://via.placeholder.com/150" alt="Product 1">
      <h3>Product 1</h3>
      <p>$19.99</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/150" alt="Product 2">
      <h3>Product 2</h3>
      <p>$29.99</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/150" alt="Product 3">
      <h3>Product 3</h3>
      <p>$39.99</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/150" alt="Product 4">
      <h3>Product 4</h3>
      <p>$49.99</p>
      <button>Add to Cart</button>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2026 Amazon Clone. All rights reserved.</p>
  </footer>

</body>
</html>
